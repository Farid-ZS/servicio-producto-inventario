# docker compose up --build   (Productos :3001, Inventario :3002)
services:
  pg-core:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: db_core }
    ports: ["5432:5432"]
  pg-operaciones:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: db_operaciones }
    ports: ["5433:5432"]
  redis:
    image: redis:7
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["15672:15672"]
  productos:
    build: ./productos
    depends_on: [pg-core, redis, rabbitmq]
    ports: ["3001:3001"]
    environment: &comun
      JWT_SECRET: dev-user-secret-change-me
      INTERNAL_JWT_SECRET: dev-internal-secret-change-me
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgres://postgres:postgres@pg-core:5432/db_core
      INVENTARIO_URL: http://inventario:3002
    restart: on-failure
  inventario:
    build: ./inventario
    depends_on: [pg-operaciones, redis, rabbitmq]
    ports: ["3002:3002"]
    environment:
      <<: *comun
      DATABASE_URL: postgres://postgres:postgres@pg-operaciones:5432/db_operaciones
    restart: on-failure
